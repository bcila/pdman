<div id="stats"
     hx-get="/partials/container-stats?host={{ host_id }}&id={{ id }}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
    {% match error %}
    {% when Some with (message) %}
    <div class="rounded-xl border border-gray-800 bg-gray-900/60 p-3 text-xs text-gray-500">{{ message }}</div>
    {% when None %}
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="rounded-xl border border-gray-800 bg-gray-900/60 p-4">
            <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-wider text-gray-500">
                <svg class="h-3.5 w-3.5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
                </svg>
                CPU
            </div>
            <div class="mt-2 text-3xl font-bold tabular-nums">{{ cpu }}</div>
        </div>
        <div class="rounded-xl border border-gray-800 bg-gray-900/60 p-4">
            <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-wider text-gray-500">
                <svg class="h-3.5 w-3.5 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 002.25-2.25V6.75a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 6.75v10.5a2.25 2.25 0 002.25 2.25zm.75-12h9v9h-9v-9z"/>
                </svg>
                Bellek
            </div>
            <div class="mt-2 text-3xl font-bold tabular-nums">{{ mem }} <span class="text-sm font-normal text-gray-500">/ {{ mem_limit }}</span></div>
            <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-gray-800">
                <div class="h-full rounded-full bg-gradient-to-r from-sky-500 to-violet-500" style="width: {{ mem_percent }}%"></div>
            </div>
        </div>
    </div>
    {% endmatch %}
</div>
