[workspace]
resolver = "3"

members = [
    "crates/pdman",
    "crates/pdman-agent",
    "crates/pdman-common",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pdman-common = { path = "crates/pdman-common" }

tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
axum = "0.8.9"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "logging", "tls12"] }
webpki-roots = "0.26"
askama = "0.16.1"
tower-http = { version = "0.7.1", features = ["fs"] }
bollard = "0.21.1"
bytes = "1"
hyper = { version = "1.3", features = ["client", "http1"] }
hyper-util = { version = "0.1.5", features = ["http1", "client-legacy", "tokio"] }
hyperlocal = "0.9.0"
http = "1.1"
http-body-util = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
